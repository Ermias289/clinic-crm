<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#f3f7f9; font-family:Arial, Helvetica, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:20px;">

                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">

                    <!-- Header -->
                    <tr>
                        <td style="background-color:#4CAF50; text-align:center; padding:25px; color:#ffffff;">
                            <h1 style="margin:0; font-size:26px;">Smile Dental Clinic</h1>
                            <p style="margin:6px 0 0 0; font-size:14px;">
                                Your secure OTP for verification
                            </p>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:30px; text-align:center; color:#555;">
                            <p style="font-size:16px; margin-bottom:15px;">Hello,</p>

                            <p style="font-size:16px; margin-bottom:20px;">
                                Please use the following One-Time Password (OTP) to confirm your action:
                            </p>

                            <!-- OTP -->
                            <p style="
                font-size:32px;
                font-weight:bold;
                letter-spacing:6px;
                color:#4CAF50;
                margin:25px 0;">
                                {{OTP}}
                            </p>

                            <p style="font-size:14px; color:#888;">
                                This OTP is valid for <strong>5 minutes</strong>.
                            </p>

                            <p style="font-size:14px; color:#888;">
                                If you did not request this OTP, please ignore this email.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f1f1f1; text-align:center; padding:15px; font-size:12px; color:#999;">
                            © 2025 Smile Dental Clinic. All rights reserved.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
