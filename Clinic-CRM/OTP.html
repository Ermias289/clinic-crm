<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#E6D9EF; font-family:Arial, Helvetica, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:20px;">

                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:6px; overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td style="background-color:#510771; text-align:center; padding:25px; color:#ffffff;">

                            <h1 style="margin:0; font-size:26px;">Lucid Dental Clinic</h1>
                            <p style="margin:6px 0 0 0; font-size:14px;">
                                Your secure OTP for verification
                            </p>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:30px; text-align:center; color:#555;">
                            <p style="font-size:16px; margin-bottom:15px;">Hello,</p>

                            <p style="font-size:16px; margin-bottom:20px;">
                                Please use the following One-Time Password (OTP) to confirm your action:
                            </p>

                            <!-- OTP -->
                            <p style="
                            font-size:32px;
                            font-weight:bold;
                            letter-spacing:6px;
                            color:#510771;
                            margin:25px 0;
                            background-color:#E6D9EF;
                            display:inline-block;
                            padding:10px 22px;
                            border-radius:6px;
                            ">
                                {{OTP}}
                            </p>

                            <p style="font-size:14px; color:#888;">
                                This OTP is valid for <strong>5 minutes</strong>.
                            </p>

                            <p style="font-size:14px; color:#888;">
                                If you did not request this OTP, please ignore this email.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#F5F6FA; text-align:center; padding:15px; font-size:12px; color:#999;">
                            © 2025 LUCID Dental Clinic. All rights reserved.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
